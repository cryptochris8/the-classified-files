<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Declassified</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="payment-styles.css">
</head>
<body>
    <div id="game-container">
        <div class="unlock-message">
            <div class="unlock-notification">
                <h3>🎉 Payment Successful!</h3>
                <p>Thank you for your purchase!</p>
                <p id="unlock-message">Your case file has been unlocked.</p>
                <button onclick="handleSuccess()" class="choice-button">Start Playing</button>
            </div>
        </div>
    </div>
    <script>
        // Get case key and session ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');

        // Clean the case key - handle malformed URLs where session_id got appended with ? instead of &
        // e.g., "september11?session_id=xxx" should become "september11"
        let caseKey = urlParams.get('case');
        if (caseKey && caseKey.includes('?')) {
            caseKey = caseKey.split('?')[0];
            console.log('🔧 Cleaned malformed case key to:', caseKey);
        }

        // Update message if we know which case
        if (caseKey) {
            const caseNames = {
                'diddy-case': 'Diddy Federal Case',
                'charlie-kirk': 'Charlie Kirk Assassination',
                'epstein': 'The Epstein Files',
                'jfk': 'JFK Assassination Files',
                'watergate': 'Watergate Files',
                'september11': '9/11 Commission Files',
                'hunterlaptop': 'Hunter Biden Laptop',
                'pentagon-papers': 'Pentagon Papers',
                'mkultra': 'MKUltra Files',
                'panama-papers': 'Panama Papers',
                'iran-contra': 'Iran-Contra Affair',
                'cointelpro': 'COINTELPRO Files',
                'snowden': 'Snowden Revelations',
                'tuskegee': 'Tuskegee Experiment',
                'paperclip': 'Operation Paperclip'
            };
            const caseName = caseNames[caseKey] || caseKey;
            document.getElementById('unlock-message').textContent = `"${caseName}" has been unlocked!`;
        }

        // Unlock the purchase immediately on page load
        function unlockPurchase() {
            // Add to purchasedCases array (this is what hasPurchased() checks)
            const purchases = JSON.parse(localStorage.getItem('purchasedCases') || '[]');
            if (caseKey && !purchases.includes(caseKey)) {
                purchases.push(caseKey);
                localStorage.setItem('purchasedCases', JSON.stringify(purchases));
                console.log('✅ Unlocked case:', caseKey);
            }

            // Also store session info for verification
            if (sessionId) {
                localStorage.setItem('lastPurchaseSession', JSON.stringify({
                    sessionId: sessionId,
                    caseKey: caseKey,
                    timestamp: new Date().toISOString()
                }));
            }
        }

        // Unlock immediately when page loads
        unlockPurchase();

        async function handleSuccess() {
            // Verify payment with server (optional, non-blocking)
            if (sessionId) {
                try {
                    const serverUrl = 'https://the-classified-files-production-1c78.up.railway.app';
                    const response = await fetch(serverUrl + '/verify-payment/' + sessionId);
                    const data = await response.json();
                    console.log('Payment verified:', data);
                } catch (error) {
                    console.log('Could not verify payment with server, but purchase is saved locally');
                }
            }

            // Redirect to main game (handle GitHub Pages subdirectory)
            const pathParts = window.location.pathname.split('/');
            pathParts.pop(); // Remove payment-success.html
            const basePath = pathParts.join('/') || '';
            window.location.href = window.location.origin + basePath + '/';
        }
    </script>
</body>
</html>
